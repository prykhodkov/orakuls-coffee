; Налаштування PHP для API на хостингу cPanel (читається як .user.ini у цій папці; BE-009).
; УВАГА: чи застосовується .user.ini на цьому хостингу й які ліміти реально діють — перевіряється ПІСЛЯ деплою
; (tests/hosting-check.php і ini_get у тимчасовому діагностичному скрипті). Якщо не діє — задати в cPanel → MultiPHP INI Editor.
display_errors = Off
log_errors = On
; Найгірший запит імпорту (1000 елементів × 3 × 500 чотирибайтних символів) ≈ 6 МБ
post_max_size = 8M
memory_limit = 128M
; error_log сюди НЕ прописаний: шлях залежить від хостингу (BE-009 з'ясовує, куди він іде за замовчуванням)
