<!doctype html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e150d">
    <meta name="description" content="Orākuls Coffee — coffee with a message. Fate in Your Hands.">
    <title>Orākuls Coffee</title>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Orākuls Coffee">
    <meta property="og:title" content="Orākuls Coffee — Fate in Your Hands">
    <meta property="og:description" content="Orākuls Coffee — coffee with a message. Fate in Your Hands.">
    <meta property="og:image" content="%VITE_SITE_URL%/images/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="preload" as="image" type="image/webp" href="/images/logo.webp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <script type="module" src="/src/app/main.js"></script>
</head>

<body>
    <canvas class="sky" aria-hidden="true"></canvas>

    <main class="app">
        <!-- Крок 1: вибір мови -->
        <section class="screen screen--lang is-active" data-screen="lang">
            <h1 class="screen__logo">
                <img class="logo" src="/images/logo.webp" width="866" height="566" alt="Orākuls Coffee — Fate in Your Hands">
            </h1>

            <p class="lang-title">
                <span lang="lv">Izvēlieties valodu</span>
                <span lang="en">Choose your language</span>
                <span lang="ru">Выберите язык</span>
            </p>

            <div class="lang-list">
                <button class="lang-btn" type="button" data-lang="lv" lang="lv">
                    <svg class="lang-btn__flag" viewBox="0 0 30 15" aria-hidden="true">
                        <rect width="30" height="15" fill="#9e3039"/>
                        <rect y="6" width="30" height="3" fill="#fff"/>
                    </svg>
                    Latviešu
                </button>
                <button class="lang-btn" type="button" data-lang="en" lang="en">
                    <svg class="lang-btn__flag" viewBox="0 0 60 30" aria-hidden="true">
                        <clipPath id="flag-gb-clip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
                        <rect width="60" height="30" fill="#012169"/>
                        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                        <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#flag-gb-clip)" stroke="#c8102e" stroke-width="4"/>
                        <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
                        <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
                    </svg>
                    English
                </button>
                <button class="lang-btn" type="button" data-lang="ru" lang="ru">
                    <svg class="lang-btn__flag" viewBox="0 0 30 15" aria-hidden="true">
                        <rect width="30" height="5" fill="#fff"/>
                        <rect y="5" width="30" height="5" fill="#0039a6"/>
                        <rect y="10" width="30" height="5" fill="#d52b1e"/>
                    </svg>
                    Русский
                </button>
            </div>
        </section>

        <!-- Крок 2: кнопка «Отримати послання» -->
        <section class="screen screen--intro" data-screen="intro">
            <img class="logo" src="/images/logo.webp" width="866" height="566" alt="Orākuls Coffee — Fate in Your Hands">

            <div class="intro">
                <p class="eyebrow" data-i18n="tagline"></p>
                <h2 class="intro__title" data-i18n="introTitle"></h2>
            </div>

            <button class="btn btn--primary" type="button" data-action="reveal" data-i18n="getMessage"></button>
            <p class="error" data-error role="alert" data-i18n="error" hidden></p>
        </section>

        <!-- Анімація «пошуку» послання -->
        <section class="screen screen--reveal" data-screen="reveal" aria-live="polite">
            <div class="reveal__eye">
                <img src="/images/eye.webp" width="849" height="342" alt="">
            </div>
            <p class="reveal__text" data-i18n="revealing"></p>
        </section>

        <!-- Послання -->
        <section class="screen screen--message" data-screen="message">
            <img class="message__eye" src="/images/eye.webp" width="849" height="342" alt="">

            <p class="eyebrow" data-i18n="messageLabel"></p>
            <blockquote class="message__text" data-message-text></blockquote>

            <div class="divider" aria-hidden="true"><span>✦</span></div>
            <p class="message__slogan">Fate in Your Hands</p>
        </section>
    </main>
</body>
</html>
